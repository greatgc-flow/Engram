name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: "pip"
        cache-dependency-path: requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run consistency checks
      run: |
        python _sys/checks/check_encoding.py
        python _sys/checks/check_root_hygiene.py
        python _sys/checks/check_unreferenced_functions.py

    - name: Run unit tests
      run: |
        python -u -m pytest _sys/tests/unit -v --tb=short
