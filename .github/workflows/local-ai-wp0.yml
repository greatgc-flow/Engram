name: WP0 Windows Python feasibility
on:
  push:
    branches: [test/local-ai-wp0-windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-provider:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Fetch the two public test artifacts and run offline canaries
        shell: pwsh
        run: |
          $pins = Get-Content tools/feasibility/windows-python.lock.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP $pins.archive.filename
          $wheel = Join-Path $env:RUNNER_TEMP $pins.wheel.filename
          Invoke-WebRequest $pins.archive.url -OutFile $archive
          Invoke-WebRequest $pins.wheel.url -OutFile $wheel
          python -B tools/feasibility/windows_python.py --archive $archive --wheel $wheel
          exit $LASTEXITCODE
      - name: Repeat using a Windows Basic User token
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = Get-Content tools/feasibility/windows-python.lock.json -Raw | ConvertFrom-Json
          $script = (Resolve-Path tools/feasibility/windows_python.py).Path
          $interpreter = (Get-Command python.exe).Source
          $dir = $env:RUNNER_TEMP
          $receipt = Join-Path $dir 'basic-user-output.txt'
          $done = Join-Path $dir 'basic-user-complete.txt'
          $extra = Get-Content tools/feasibility/windows-pair.lock.json -Raw | ConvertFrom-Json
          foreach ($pin in @($extra.archive, $extra.wheel)) {
            Invoke-WebRequest $pin.url -OutFile (Join-Path $dir $pin.filename)
          }
          $pair = (Resolve-Path tools/feasibility/windows_pair.py).Path
          $pairOutput = Join-Path $dir 'basic-user-pair.txt'
          $cmdFile = Join-Path $dir 'wp0-basic-user.cmd'
          @(
            '@echo off'
            ('"{0}" -B "{1}" --archive "{2}" --wheel "{3}" > "{4}" 2>&1' -f $interpreter,$script,(Join-Path $dir $pins.archive.filename),(Join-Path $dir $pins.wheel.filename),$receipt)
            ('if errorlevel 1 (echo 1 > "{0}" & exit /b 1)' -f $done)
            ('"{0}" -B "{1}" --cache "{2}" --second-temp-parent "{2}" > "{3}" 2>&1' -f $interpreter,$pair,$dir,$pairOutput)
            ('echo %ERRORLEVEL% > "{0}"' -f $done)
          ) | Set-Content $cmdFile -Encoding ascii
          & runas.exe /trustlevel:0x20000 "cmd.exe /d /c `"`"$cmdFile`"`""
          if ($LASTEXITCODE -ne 0) { throw 'Windows Basic User launch unavailable' }
          $deadline = [DateTime]::UtcNow.AddMinutes(4)
          while (!(Test-Path $done) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Seconds 2 }
          if (!(Test-Path $done)) { throw 'No completed Basic User receipt' }
          $output = Get-Content $receipt -Raw
          Write-Output $output
          if (Test-Path $pairOutput) { Get-Content $pairOutput }
          if ([int](Get-Content $done -Raw) -ne 0) { throw 'Basic User probe failed' }
          $result = $output | ConvertFrom-Json
          if ($result.native -ne 'PASS' -or $result.effective_admin -ne $false) { throw 'Effective non-admin token required' }
