name: CI

on:
  workflow_call: {}
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"
        cache: "pip"
        cache-dependency-path: requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run consistency checks
      run: |
        python _sys/checks/check_encoding.py
        python _sys/checks/check_root_hygiene.py
        python _sys/checks/check_unreferenced_functions.py

    - name: Run unit tests
      run: |
        python -X faulthandler -u -m pytest _sys/tests/unit -v --tb=short --junitxml=contract-results.xml

    - name: Require release contracts without skips
      if: always()
      run: python tools/release_gate/check_required_tests.py --report contract-results.xml

    # Step 2 (Option D): CP949 / Korean-locale emulated test verification gate.
    # Emulates CP949 at the encoding boundary on hosted English-locale runners.
    # Unconditionally fails if any test in the cp949 set is skipped or if the set is empty.
    # Note: Emulated encoding cannot prove production MBCS behavior across arbitrary Windows APIs.
    # Verification under real system ACP (ACP=949) is maintained as a pre-release gate;
    # see docs/cp949_verification.md.
    - name: Verify CP949 emulated tests (no skips)
      run: |
        python -X faulthandler -u -m pytest _sys/tests/unit -v -m cp949 --cp949-strict --tb=short
