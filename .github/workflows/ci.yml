name: CI

on:
  workflow_call: {}
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14"
        cache: "pip"
        cache-dependency-path: requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        pip install -r requirements-dev.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Observe Windows display adapters
      shell: pwsh
      run: |
        $observation = python -B tools/feasibility/windows_accelerators.py
        $code = $LASTEXITCODE
        $inventory = $observation | ConvertFrom-Json -ErrorAction Stop
        Write-Output $observation
        if ($code -eq 1 -and $inventory.coverage -eq 'UNKNOWN') { exit 0 }
        exit $code

    - name: Run consistency checks
      run: |
        python _sys/checks/check_encoding.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python _sys/checks/check_root_hygiene.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python _sys/checks/check_unreferenced_functions.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run unit tests
      run: |
        python -X faulthandler -u -m pytest _sys/tests/unit -v --cp949-strict --tb=short --junitxml=contract-results.xml

    - name: Require release contracts without skips
      if: always()
      run: python tools/release_gate/check_required_tests.py --report contract-results.xml

    - name: Remove runner-preinstalled Python 3.15
      # A hosted-toolcache 3.15.x leaks its Lib into the managed 3.15.y venv's sys.path
      # (ABI mismatch on _socket) once the pinned patch differs from the image's.
      shell: pwsh
      run: Remove-Item C:\hostedtoolcache\windows\Python\3.15* -Recurse -Force -ErrorAction SilentlyContinue
    - name: Bootstrap managed Python
      shell: pwsh
      run: |
        cmd /d /c _sys\core\bootstrap.bat --skip-update --skip-ai
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (!(Test-Path _sys/env/python/python.exe)) { throw "Managed Python missing" }

    - name: Require real venv proof
      env:
        ENGRAM_REQUIRE_REAL_VENV: "1"
      run: |
        pytest -p no:cacheprovider "_sys/tests/unit/test_venv_repair.py::test_real_venv_refresh_and_regen" -v -rs --tb=short
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify legacy Multi-Python binding after bootstrap
      run: python -B tools/feasibility/windows_legacy_binding.py

    - name: Verify explicit Python execution across Windows shells
      run: python -B tools/feasibility/windows_python_run.py

    - name: Verify selective Python installation and project pins
      shell: pwsh
      timeout-minutes: 12
      run: |
        $ErrorActionPreference = 'Stop'
        $cache = Join-Path $env:RUNNER_TEMP 'engram-offline-archives'
        New-Item -ItemType Directory $cache | Out-Null
        $pins = Get-Content _sys/defaults/python-offline-artifacts.json -Raw | ConvertFrom-Json
        foreach ($item in $pins.artifacts) {
          $name = "cpython-$($item.version)+$($pins.release)-x86_64-pc-windows-msvc-install_only.tar.gz"
          $encoded = $name.Replace('+', '%2B')
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/$($pins.release)/$encoded"
          Invoke-WebRequest $url -OutFile (Join-Path $cache $name)
        }
        python -B tools/feasibility/windows_python_install.py $cache
        exit $LASTEXITCODE

    - name: Verify atomic Python patch and retained project pin
      shell: pwsh
      timeout-minutes: 8
      run: |
        $ErrorActionPreference = 'Stop'
        $cache = Join-Path $env:RUNNER_TEMP 'engram-offline-archives'
        $old = Get-Content tools/feasibility/windows-python-patch.lock.json -Raw | ConvertFrom-Json
        $name = "cpython-$($old.version)+$($old.tag)-x86_64-pc-windows-msvc-install_only.tar.gz"
        $encoded = $name.Replace('+', '%2B')
        $url = "https://github.com/astral-sh/python-build-standalone/releases/download/$($old.tag)/$encoded"
        Invoke-WebRequest $url -OutFile (Join-Path $cache $name)
        python -B tools/feasibility/windows_python_patch.py $cache
        exit $LASTEXITCODE

    - name: Verify locked environment recovery across actual volumes
      shell: pwsh
      timeout-minutes: 12
      run: |
        $ErrorActionPreference = 'Stop'
        $pin = (Get-Content tools/feasibility/windows-python.lock.json -Raw | ConvertFrom-Json).wheel
        $wheel = Join-Path $env:RUNNER_TEMP $pin.filename
        Invoke-WebRequest $pin.url -OutFile $wheel
        python -B tools/feasibility/windows_python_env_move.py $wheel
        exit $LASTEXITCODE

    - name: Upload contract results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: contract-results-${{ github.run_id }}-${{ github.run_attempt }}
        path: contract-results.xml
        if-no-files-found: warn
