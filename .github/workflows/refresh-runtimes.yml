name: Refresh runtime defaults

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch: {}

concurrency:
  group: refresh-runtime-defaults
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      ENGRAM_REFRESH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Discover complete defaults
        shell: pwsh
        run: |
          Copy-Item _sys/defaults/runtimes.json "$env:RUNNER_TEMP/runtimes-before.json"
          python tools/refresh_runtime_defaults.py --body-file "$env:RUNNER_TEMP/refresh-body.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash _sys/defaults/runtimes.json -Algorithm SHA256).Hash | Set-Content "$env:RUNNER_TEMP/tested-defaults.sha256"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run consistency checks
        run: |
          python _sys/checks/check_encoding.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python _sys/checks/check_root_hygiene.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python _sys/checks/check_unreferenced_functions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run unit tests
        run: |
          python -X faulthandler -u -m pytest _sys/tests/unit -v --cp949-strict --tb=short --junitxml=contract-results.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require release contracts without skips
        if: always()
        run: python tools/release_gate/check_required_tests.py --report contract-results.xml
      - name: Remove runner-preinstalled Python 3.15
        # A hosted-toolcache 3.15.x leaks its Lib into the managed 3.15.y venv's sys.path
        # (ABI mismatch on _socket) whenever the refresh bumps the pin past the image's patch.
        shell: pwsh
        run: Remove-Item C:\hostedtoolcache\windows\Python\3.15* -Recurse -Force -ErrorAction SilentlyContinue
      - name: Bootstrap managed Python
        shell: pwsh
        run: |
          cmd /d /c _sys\core\bootstrap.bat --skip-update --skip-ai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path _sys/env/python/python.exe)) { throw 'Managed Python missing' }
      - name: Require real venv proof
        shell: pwsh
        env:
          ENGRAM_REQUIRE_REAL_VENV: '1'
        run: |
          python -X faulthandler -u -m pytest "_sys/tests/unit/test_venv_repair.py::test_real_venv_refresh_and_regen" -v -rs --tb=short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish tested defaults
        shell: pwsh
        run: |
          if ((Get-FileHash _sys/defaults/runtimes.json -Algorithm SHA256).Hash -ne (Get-Content "$env:RUNNER_TEMP/tested-defaults.sha256")) { throw 'Defaults changed during tests' }
          git diff --quiet -- _sys/defaults/runtimes.json
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git checkout -B automation/refresh-runtimes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add -- _sys/defaults/runtimes.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'chore(deps): refresh validated runtime defaults'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push --force-with-lease origin HEAD:refs/heads/automation/refresh-runtimes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $headSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content "$env:RUNNER_TEMP/refresh-body.md" "`nTested commit: $headSha"
          $number = gh pr list --head automation/refresh-runtimes --base main --state open --json number --jq '.[0].number'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($number) {
            gh pr edit $number --body-file "$env:RUNNER_TEMP/refresh-body.md"
          } else {
            gh pr create --base main --head automation/refresh-runtimes --title 'chore(deps): refresh validated runtime defaults' --body-file "$env:RUNNER_TEMP/refresh-body.md"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
