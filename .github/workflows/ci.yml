name: CI

on:
  workflow_call: {}
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"
        cache: "pip"
        cache-dependency-path: requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        pip install -r requirements-dev.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run consistency checks
      run: |
        python _sys/checks/check_encoding.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python _sys/checks/check_root_hygiene.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python _sys/checks/check_unreferenced_functions.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run unit tests
      run: |
        python -X faulthandler -u -m pytest _sys/tests/unit -v --cp949-strict --tb=short --junitxml=contract-results.xml

    - name: Require release contracts without skips
      if: always()
      run: python tools/release_gate/check_required_tests.py --report contract-results.xml

    - name: Remove runner-preinstalled Python 3.15
      # A hosted-toolcache 3.15.x leaks its Lib into the managed 3.15.y venv's sys.path
      # (ABI mismatch on _socket) once the pinned patch differs from the image's.
      shell: pwsh
      run: Remove-Item C:\hostedtoolcache\windows\Python\3.15* -Recurse -Force -ErrorAction SilentlyContinue
    - name: Bootstrap managed Python
      shell: pwsh
      run: |
        cmd /d /c _sys\core\bootstrap.bat --skip-update --skip-ai
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (!(Test-Path _sys/env/python/python.exe)) { throw "Managed Python missing" }

    - name: Require real venv proof
      env:
        ENGRAM_REQUIRE_REAL_VENV: "1"
      run: |
        pytest -p no:cacheprovider "_sys/tests/unit/test_venv_repair.py::test_real_venv_refresh_and_regen" -v -rs --tb=short
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload contract results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: contract-results-${{ github.run_id }}-${{ github.run_attempt }}
        path: contract-results.xml
        if-no-files-found: warn
