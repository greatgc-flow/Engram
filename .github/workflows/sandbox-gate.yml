name: Windows Sandbox release and weekly gate

on:
  workflow_dispatch: {}
  schedule:
    # Saturday 03:00 Asia/Seoul (Friday 18:00 UTC).
    - cron: "0 18 * * 5"
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: engram-sandbox
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-candidate:
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build assets once
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = (Get-Content _sys/core/version.json -Raw | ConvertFrom-Json).version
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'HOLD: tag and package version differ' }
          }
          python tools/winget/build_exe.py
          if ($LASTEXITCODE) { throw 'HOLD: executable build failed' }
          python tools/winget/build_package.py --dist-dir release/assets --manifest-dir release/assets/manifests
          if ($LASTEXITCODE) { throw 'HOLD: package build failed' }
      - name: Freeze candidate
        run: python _sys/checks/release_evidence.py freeze --assets release/assets --out release/candidate.json
      - name: Upload immutable candidate and assets
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  clean-room-sandbox:
    needs: build-candidate
    runs-on: [self-hosted, Windows, X64, engram-sandbox]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Verify hashes and prepare candidate Sandbox root
        shell: pwsh
        run: |
          python .github/scripts/check_candidate_assets.py release/candidate.json release/assets
          if ($LASTEXITCODE) { throw 'HOLD: candidate mismatch' }
          $sessionId = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          if ($sessionId -eq 0) { throw 'HOLD: Sandbox needs an interactive run.cmd runner' }
          Get-Command WindowsSandbox.exe -ErrorAction Stop
          $root = Join-Path $env:GITHUB_WORKSPACE "sandbox-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'HOLD: Sandbox root already exists' }
          $zip = @(Get-ChildItem release/assets -Filter *.zip)
          if ($zip.Count -ne 1) { throw 'HOLD: expected one portable archive' }
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $root
          # Add source-only test harness; runtime files come from the frozen ZIP.
          Copy-Item _sys/tests "$root/_sys/tests" -Recurse
          Copy-Item tools "$root/tools" -Recurse
          Copy-Item requirements-dev.txt "$root/requirements-dev.txt"
          "SANDBOX_ROOT=$root" >> $env:GITHUB_ENV
      - name: Run clean-room candidate checks
        id: sandbox
        shell: pwsh
        run: |
          & "$env:SANDBOX_ROOT/_sys/tests/run-sandbox-test.bat"
          if ($LASTEXITCODE) { throw 'HOLD: Sandbox failed or timed out' }
      - name: Emit candidate-bound evidence
        if: always()
        shell: pwsh
        env:
          SANDBOX_OUTCOME: ${{ steps.sandbox.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if (!(Test-Path release/candidate.json)) { throw 'HOLD: missing candidate' }
          $candidate = Get-Content release/candidate.json -Raw | ConvertFrom-Json
          $status = 'HOLD'
          if ($env:SANDBOX_OUTCOME -eq 'success' -and $env:JOB_STATUS -eq 'success') { $status = 'PASS' }
          @{
            status = $status
            candidate_sha256s = $candidate.candidate_sha256s
            cancelled = ($env:JOB_STATUS -eq 'cancelled')
            skipped = ($env:SANDBOX_OUTCOME -eq 'skipped')
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
          } | ConvertTo-Json -Depth 10 | Set-Content release/sandbox_evidence.json -Encoding utf8NoBOM
      - name: Upload Sandbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/sandbox_evidence.json
          if-no-files-found: error
          retention-days: 30

  upgrade-gate:
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Verify candidate assets before upgrade
        shell: pwsh
        run: |
          python .github/scripts/check_candidate_assets.py release/candidate.json release/assets
          if ($LASTEXITCODE) { throw 'HOLD: candidate mismatch' }
      - name: Download previous stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (!(Test-Path release/candidate.json)) { throw 'HOLD: missing candidate' }
          $candidate = Get-Content release/candidate.json -Raw | ConvertFrom-Json
          $candTag = $candidate.tag
          $releases = gh release list --json tagName,isDraft,isPrerelease --limit 30 | ConvertFrom-Json
          $prevRelease = $releases | Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -ne $candTag } | Select-Object -First 1
          if (-not $prevRelease) { throw 'HOLD: no previous published release found' }
          $prevTag = $prevRelease.tagName
          Write-Host "Previous stable release tag: $prevTag (candidate: $candTag)"
          "PREV_TAG=$prevTag" >> $env:GITHUB_ENV

          $prevDir = Join-Path $env:RUNNER_TEMP "prev-release-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $prevDir | Out-Null
          gh release download "$prevTag" --pattern "*.zip" --dir "$prevDir"
          if ($LASTEXITCODE) { throw 'HOLD: failed to download previous release zip' }
          $prevZip = @(Get-ChildItem $prevDir -Filter *.zip)
          if ($prevZip.Count -ne 1) { throw 'HOLD: expected exactly one zip in previous release' }
          "PREV_ZIP=$($prevZip[0].FullName)" >> $env:GITHUB_ENV
      - name: Extract previous release to isolated root
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "isolated-upgrade-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'HOLD: isolated root already exists' }
          Expand-Archive -LiteralPath $env:PREV_ZIP -DestinationPath $root
          "ISOLATED_ROOT=$root" >> $env:GITHUB_ENV
      - name: Seed user data
        shell: pwsh
        run: |
          python tools/release_gate/upgrade_harness.py seed --target-dir $env:ISOLATED_ROOT
          if ($LASTEXITCODE) { throw 'HOLD: failed to seed user data' }
      - name: Run upgrade harness against candidate
        id: upgrade
        shell: pwsh
        run: |
          $candZip = @(Get-ChildItem release/assets -Filter *.zip)
          if ($candZip.Count -ne 1) { throw 'HOLD: expected exactly one candidate zip' }
          python tools/release_gate/upgrade_harness.py run `
            --target-dir $env:ISOLATED_ROOT `
            --candidate-zip $candZip[0].FullName `
            --candidate-json release/candidate.json `
            --prev-tag $env:PREV_TAG `
            --out release/upgrade_evidence.json
          if ($LASTEXITCODE) { throw 'HOLD: upgrade harness failed' }
      - name: Ensure upgrade evidence on failure
        if: always()
        shell: pwsh
        env:
          UPGRADE_OUTCOME: ${{ steps.upgrade.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if (!(Test-Path release/upgrade_evidence.json)) {
            $candidate = if (Test-Path release/candidate.json) { Get-Content release/candidate.json -Raw | ConvertFrom-Json } else { $null }
            @{
              status = 'HOLD'
              candidate_sha256s = if ($candidate) { $candidate.candidate_sha256s } else { @{} }
              previous_tag = if ($env:PREV_TAG) { $env:PREV_TAG } else { 'unknown' }
              cancelled = ($env:JOB_STATUS -eq 'cancelled')
              skipped = ($env:UPGRADE_OUTCOME -eq 'skipped')
              run_id = $env:GITHUB_RUN_ID
              run_attempt = $env:GITHUB_RUN_ATTEMPT
            } | ConvertTo-Json -Depth 10 | Set-Content release/upgrade_evidence.json -Encoding utf8NoBOM
          }
      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/upgrade_evidence.json
          if-no-files-found: error
          retention-days: 30

  winget-smoke:
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Verify candidate hashes
        shell: pwsh
        run: |
          python .github/scripts/check_candidate_assets.py release/candidate.json release/assets
          if ($LASTEXITCODE) { throw 'HOLD: candidate mismatch' }
      - name: Install and uninstall exact candidate with WinGet
        id: winget
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "winget-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python tools/release_gate/winget_smoke.py --candidate release/candidate.json --assets release/assets --install-root "$root" --user-data "$root/.engram" --out release/winget_evidence.json
          if ($LASTEXITCODE) { throw 'HOLD: WinGet smoke failed (absence is HOLD)' }
      - name: Ensure failed or skipped smoke emits HOLD
        if: always()
        shell: pwsh
        env:
          SMOKE_OUTCOME: ${{ steps.winget.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if (!(Test-Path release/winget_evidence.json) -or $env:SMOKE_OUTCOME -ne 'success' -or $env:JOB_STATUS -ne 'success') {
            $candidate = if (Test-Path release/candidate.json) { Get-Content release/candidate.json -Raw | ConvertFrom-Json } else { $null }
            @{
              status = 'HOLD'
              candidate_sha256s = if ($candidate) { $candidate.candidate_sha256s } else { @{} }
              cancelled = ($env:JOB_STATUS -eq 'cancelled')
              skipped = ($env:SMOKE_OUTCOME -eq 'skipped')
              run_id = $env:GITHUB_RUN_ID
              run_attempt = $env:GITHUB_RUN_ATTEMPT
            } | ConvertTo-Json -Depth 10 | Set-Content release/winget_evidence.json -Encoding utf8NoBOM
          }
      - name: Upload WinGet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winget-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/winget_evidence.json
          if-no-files-found: error
          retention-days: 30

  promotion:
    # Do not depend on the self-hosted job: a missing runner must have a bounded HOLD.
    needs: [build-candidate, upgrade-gate, winget-smoke]
    runs-on: windows-latest
    timeout-minutes: 55
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Bounded wait for Sandbox (45 minutes)
        timeout-minutes: 46
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const wait = new Function('github', 'context', 'core',
              'return (async () => {' + fs.readFileSync('.github/scripts/wait_for_sandbox.js', 'utf8') + '})()');
            await wait(github, context, core);
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: winget-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Verify before promotion or publish
        shell: pwsh
        run: |
          python .github/scripts/check_candidate_assets.py release/candidate.json release/assets evidence/sandbox_evidence.json
          if ($LASTEXITCODE) { throw 'HOLD: candidate mismatch' }
          python _sys/checks/release_evidence.py verify --candidate release/candidate.json --evidence evidence/sandbox_evidence.json --upgrade-evidence evidence/upgrade_evidence.json --winget-evidence evidence/winget_evidence.json
          if ($LASTEXITCODE) { throw 'HOLD: Sandbox, upgrade, or WinGet evidence rejected' }
      - name: Publish verified tag assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release/assets -Recurse -File | ForEach-Object FullName)
          gh release create "$env:GITHUB_REF_NAME" @assets --draft --verify-tag --title "$env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE) { throw 'HOLD: draft creation or asset upload failed' }
          gh release edit "$env:GITHUB_REF_NAME" --draft=false
          if ($LASTEXITCODE) { throw 'HOLD: publication failed' }
      - name: Report HOLD
        if: failure() || cancelled()
        shell: pwsh
        run: '"HOLD: promotion requires successful Sandbox, upgrade, and WinGet jobs and matching evidence; no release approved." >> $env:GITHUB_STEP_SUMMARY'
